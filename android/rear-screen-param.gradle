// 播放通知写入小米背屏参数。背屏只读取这个键。
def rearScreenMetadata = new File(
        rootProject.projectDir.parentFile,
        "node_modules/react-native-track-player/android/src/main/java/com/guichaguri/trackplayer/service/metadata/MetadataManager.java"
)

def patchRearScreenParam = tasks.register("patchRearScreenParam") {
    onlyIf {
        !rearScreenMetadata.exists() || !rearScreenMetadata.getText("UTF-8").contains("miui.rear.param")
    }
    doLast {
        if (!rearScreenMetadata.exists()) {
            throw new GradleException("找不到播放库的 MetadataManager.java")
        }
        def text = rearScreenMetadata.getText("UTF-8")
        def needle = "service.startForeground(1, builder.build());"
        def count = text.count(needle)
        if (count != 1) {
            throw new GradleException("播放通知的发送位置出现了 " + count + " 次")
        }
        def replacement = "Bundle rearExtras = new Bundle();\n" +
                "            rearExtras.putString(\"miui.rear.param\", \"{\\\"business\\\":\\\"music\\\",\\\"enableFloat\\\":true}\");\n" +
                "            builder.addExtras(rearExtras);\n" +
                "            service.startForeground(1, builder.build());"
        rearScreenMetadata.write(text.replace(needle, replacement), "UTF-8")
    }
}

gradle.projectsEvaluated {
    rootProject.subprojects.each { sub ->
        def dir = sub.projectDir.absolutePath.replace("\\", "/")
        if (dir.contains("react-native-track-player")) {
            sub.tasks.matching { it.name == "preBuild" }.configureEach {
                dependsOn(patchRearScreenParam)
            }
        }
    }
}
